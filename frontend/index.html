<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 다크모드 설정은 Tailwind CDN 로드 뒤에 둔다 (05-conventions.md)
    tailwind.config = { darkMode: "class" };
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors">
  <div id="app" class="max-w-3xl mx-auto p-4 sm:p-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-xl sm:text-2xl font-bold">TaskFlow Pro</h1>
      <button
        id="theme-toggle"
        class="rounded-xl px-3 py-2 bg-white/70 dark:bg-gray-800/70 backdrop-blur-md shadow-lg border border-white/30 dark:border-gray-700/50"
        type="button"
      >
        <span id="theme-toggle-label">🌙</span>
      </button>
    </header>

    <form
      id="task-form"
      class="rounded-xl bg-white/70 dark:bg-gray-800/70 backdrop-blur-md shadow-lg border border-white/30 dark:border-gray-700/50 p-4 mb-6 space-y-3"
    >
      <div>
        <label class="block text-sm mb-1" for="task-title">제목</label>
        <input
          id="task-title"
          name="title"
          type="text"
          required
          maxlength="200"
          class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
        />
      </div>
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <label class="block text-sm mb-1" for="task-due-at">마감 시각</label>
          <input
            id="task-due-at"
            name="due_at"
            type="datetime-local"
            class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
          />
        </div>
        <div class="flex-1">
          <label class="block text-sm mb-1" for="task-status">상태</label>
          <select
            id="task-status"
            name="status"
            class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
      </div>
      <button
        type="submit"
        class="rounded-xl px-4 py-2 bg-blue-600 text-white shadow-lg hover:bg-blue-700"
      >
        추가
      </button>
    </form>

    <div id="task-list" class="space-y-3"></div>
  </div>

  <div
    id="edit-modal"
    class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md rounded-xl bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-lg border border-white/30 dark:border-gray-700/50 p-4 space-y-3"
    >
      <h2 class="text-lg font-bold">작업 수정</h2>
      <div>
        <label class="block text-sm mb-1" for="edit-title">제목</label>
        <input
          id="edit-title"
          type="text"
          required
          maxlength="200"
          class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
        />
      </div>
      <div>
        <label class="block text-sm mb-1" for="edit-description">설명</label>
        <textarea
          id="edit-description"
          class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
        ></textarea>
      </div>
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <label class="block text-sm mb-1" for="edit-due-at">마감 시각</label>
          <input
            id="edit-due-at"
            type="datetime-local"
            class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
          />
        </div>
        <div class="flex-1">
          <label class="block text-sm mb-1" for="edit-status">상태</label>
          <select
            id="edit-status"
            class="w-full rounded-xl px-3 py-2 bg-white/80 dark:bg-gray-900/60 border border-gray-300 dark:border-gray-600"
          >
            <option value="todo">할 일</option>
            <option value="in_progress">진행 중</option>
            <option value="done">완료</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button
          id="edit-cancel"
          type="button"
          class="rounded-xl px-4 py-2 bg-gray-200 dark:bg-gray-700"
        >
          취소
        </button>
        <button
          id="edit-save"
          type="button"
          class="rounded-xl px-4 py-2 bg-blue-600 text-white hover:bg-blue-700"
        >
          저장
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
